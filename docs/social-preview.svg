<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- 배경 dark -->
  <rect width="1280" height="640" fill="#0C1117"/>
  <!-- 미세 가로선 (앱 아이콘 톤 일치) -->
  <rect x="0" y="319" width="1280" height="2" fill="#131A23"/>

  <!-- 좌측 로고 (origin 280,320, scale 3.6 = 108→389 정도) -->
  <g transform="translate(160,150) scale(3.0)">
    <!-- 외곽 gold 링 -->
    <path fill="#C89B3C" d="M32,54 a22,22 0 1,0 44,0 a22,22 0 1,0 -44,0 Z"/>
    <!-- 안쪽 dark -->
    <path fill="#0C1117" d="M37,54 a17,17 0 1,0 34,0 a17,17 0 1,0 -34,0 Z"/>
    <!-- hex teal 코어 -->
    <path fill="#0AC8B9" d="M42,54 a12,12 0 1,0 24,0 a12,12 0 1,0 -24,0 Z"/>
    <!-- 가운데 dark 점 -->
    <path fill="#0C1117" d="M48,54 a6,6 0 1,0 12,0 a6,6 0 1,0 -12,0 Z"/>
    <!-- 12시 시침 마커 -->
    <path fill="#C89B3C" d="M53,30 L55,30 L55,38 L53,38 Z"/>
    <!-- 3시 마커 -->
    <path fill="#C89B3C" d="M70,53 L78,53 L78,55 L70,55 Z"/>
  </g>

  <!-- 우측 텍스트 -->
  <text x="560" y="250" font-family="Georgia, serif" font-weight="900" font-size="76" fill="#F0E6D2" letter-spacing="-1">WildRift</text>
  <text x="560" y="340" font-family="Georgia, serif" font-style="italic" font-weight="300" font-size="76" fill="#C89B3C" letter-spacing="-1">Spell Check</text>
  <!-- gold rule -->
  <rect x="560" y="370" width="80" height="2" fill="#C89B3C"/>
  <text x="560" y="430" font-family="'Noto Sans KR', sans-serif" font-size="26" fill="#A8A194">스펠 쿨다운을 한눈에</text>
  <text x="560" y="470" font-family="'Noto Sans KR', sans-serif" font-size="22" fill="#6B6557">와일드리프트 오버레이 + 한국어 티어/조합 추천</text>

  <!-- 우측 하단 mono badge -->
  <text x="560" y="540" font-family="'Courier New', monospace" font-size="16" fill="#0AC8B9" letter-spacing="3">ANDROID · MIT LICENSED · v0.1.0</text>
</svg>
